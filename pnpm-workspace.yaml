packages:
  - showcase
# pnpm 11 errors on ignored build scripts (strictDepBuilds=true by
# default). sharp powers next/image runtime image optimization;
# esbuild is pulled in by the toolchain. Approve both so install
# completes cleanly. pnpm 11.1+ reads `allowBuilds` here; the older
# `onlyBuiltDependencies` is kept for back-compat.
allowBuilds:
  esbuild: true
  sharp: true
onlyBuiltDependencies:
  - esbuild
  - sharp
