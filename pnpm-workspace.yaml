packages:
  - showcase
# pnpm 11 errors out on ignored build scripts (strictDepBuilds=true by
# default) instead of warning like pnpm 10 did. sharp is used by
# next/image for runtime image optimization; esbuild is pulled in by the
# toolchain. Approve them both so install completes cleanly.
onlyBuiltDependencies:
  - esbuild
  - sharp
