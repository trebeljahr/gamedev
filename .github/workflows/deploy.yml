# Builds the static export and serves it from the Cloudflare Worker `gamedev`
# (Workers static assets, no Worker script). See docs/cloudflare-hosting.md.
#
# build:  export, carry the previous releases' hashed files, then
#         `wrangler versions upload`. Nothing goes live in this job.
# deploy: `wrangler versions deploy <version>@100%`, then check that
#         https://gamedev.trebeljahr.com/version.json names this commit.
#
# GAMEDEV_WORKER_MODE (repository variable) gates deploy on push:
#   automatic  every push to main goes live after its build
#   unset/off  pushes only upload; a `deploy` dispatch activates
# `rollback` activates an earlier uploaded version (see `wrangler versions list`).
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: deploy (build, upload, activate) or rollback (activate an uploaded version)
        type: choice
        options: [deploy, rollback]
        default: deploy
      version_id:
        description: Worker version id to activate (rollback only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SITE: https://gamedev.trebeljahr.com

jobs:
  build:
    if: github.repository == 'trebeljahr/gamedev' && github.ref == 'refs/heads/main' && inputs.operation != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Release and download contract tests
        run: |
          node --test scripts/release.test.mjs
          (cd showcase && node --import tsx --test scripts/durable-download.test.ts)

      - name: Verify retained download objects before publishing
        run: node showcase/scripts/check-download-artifacts.mjs --remote

      # .env.production is dotenvx-encrypted; it holds the public asset origin
      # (NEXT_PUBLIC_ASSETS_BASE_URL) that the export bakes into the pages.
      - name: Build the static export
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          NEXT_DEPLOYMENT_ID: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          node scripts/write-version.mjs showcase/public
          pnpm dlx @dotenvx/dotenvx@1.64.0 run -f .env.production -- pnpm build

      # A Worker version serves only its own files; tabs opened before this
      # deploy still ask for the previous releases' chunks.
      - name: Carry the previous releases' hashed files
        run: node scripts/carry-static.mjs --site "$SITE" --out showcase/out --release "$GITHUB_SHA"

      - name: Upload a new Worker version (not live yet)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # Any failure here stops the job: only a confirmed empty list may
          # take the one-step path below.
          pnpm exec wrangler deployments list --json > deployments.json
          deployments=$(node -p 'JSON.parse(require("fs").readFileSync("deployments.json","utf8")).length')
          if [ "$deployments" -gt 0 ]; then
            pnpm exec wrangler versions upload --tag "$GITHUB_SHA" --message "gamedev $GITHUB_SHA" | tee upload.log
          else
            # Cloudflare refuses `versions upload` for a Worker that was never
            # deployed. This only happens before the zone route exists, so the
            # one-step deploy reaches no visitor.
            echo "::warning::Worker has no deployment yet; first upload uses wrangler deploy."
            pnpm exec wrangler deploy --tag "$GITHUB_SHA" --message "gamedev $GITHUB_SHA" | tee upload.log
          fi
          version_id=$(grep -oE 'Version ID: *[0-9a-f-]{36}' upload.log | grep -oE '[0-9a-f-]{36}' | tail -1)
          if [ -z "$version_id" ]; then echo "No version id in wrangler output." >&2; exit 1; fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "Uploaded Worker version $version_id for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: >-
      always() && !cancelled() &&
      github.repository == 'trebeljahr/gamedev' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.GAMEDEV_WORKER_MODE == 'automatic' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Activate the version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ inputs.operation == 'rollback' && inputs.version_id || needs.build.outputs.version_id }}
        run: |
          if ! [[ "$VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]; then echo "Expected a Worker version id, got '$VERSION_ID'." >&2; exit 1; fi
          pnpm exec wrangler versions deploy "$VERSION_ID@100%" --yes --message "gamedev ${{ github.event_name }} $GITHUB_SHA"

      - name: Verify the serving commit
        if: inputs.operation != 'rollback'
        run: node scripts/verify-release.mjs "$GITHUB_SHA"
